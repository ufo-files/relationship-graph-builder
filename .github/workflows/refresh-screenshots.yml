name: Refresh README graph screenshots

on:
  workflow_run:
    workflows: ["Rebuild graph from machine-data"]
    types: [completed]
    branches: [main]
  pull_request:
    paths:
      - "index.html"
      - "*.js"
      - "styles.css"
      - "data/**"
      - "vendor/**"
      - "assets/**"
      - "!assets/screenshots/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/build_catalog.py"
      - "scripts/capture_graph_screenshots.mjs"
      - "scripts/serve_preview.py"
      - ".github/workflows/refresh-screenshots.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event != 'pull_request')
    outputs:
      published: ${{ steps.publish.outputs.published }}
      revision: ${{ steps.publish.outputs.revision }}
      input-revision: ${{ steps.publish.outputs.input_revision }}
    # Playwright's managed Chromium image is not available for this ARM64 host.
    runs-on: ubuntu-latest
    concurrency:
      group: relationship-graph-screenshots-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
      # Finish the current capture; GitHub keeps the latest pending refresh.
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Check out builder
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'main' }}
          persist-credentials: ${{ github.event_name != 'pull_request' }}
          ssh-key: ${{ github.event_name != 'pull_request' && secrets.MAIN_AUTOMATION_DEPLOY_KEY || '' }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install screenshot dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Refresh graph screenshots
        shell: bash
        run: |
          server_log="$RUNNER_TEMP/graph-builder-http.log"
          python3 scripts/serve_preview.py --port 4173 >"$server_log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat "$server_log"
              exit 1
            fi
            sleep 1
          done
          npm run screenshots

      - name: Upload PR screenshot preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: graph-screenshots
          path: assets/screenshots
          retention-days: 7

      - name: Commit refreshed screenshots
        id: publish
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          input_revision="$(python3 -c 'import json; print(json.load(open("data/catalog.json"))["input"]["revision"])')"
          echo "input_revision=$input_revision" >> "$GITHUB_OUTPUT"
          if [ -z "$(git status --porcelain -- README.md assets/screenshots)" ]; then
            git fetch origin main
            if [ "$(git rev-parse origin/main)" != "$(git rev-parse HEAD)" ]; then
              echo "Main advanced during capture; refusing stale screenshots" >&2
              exit 1
            fi
            echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "published=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/screenshots
          git commit -m "Refresh README graph screenshots"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              echo "published=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git fetch origin main
            if [ "$(git rev-parse origin/main)" != "$(git rev-parse HEAD^)" ]; then
              echo "Main advanced after capture; refusing to publish stale screenshots" >&2
              exit 1
            fi
            sleep $((attempt * 2))
          done
          echo "Unable to publish the refreshed graph screenshots" >&2
          exit 1

  homepage:
    name: Rebuild ufo-files.app after screenshots
    needs: refresh
    if: github.event_name != 'pull_request' && needs.refresh.outputs.published == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: ufo-files-homepage-graph-refresh
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Check out refresh script
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          path: _graph
          sparse-checkout: scripts

      - name: Check out homepage
        uses: actions/checkout@v7
        with:
          repository: ufo-files/homepage
          ref: main
          path: _homepage
          fetch-depth: 0
          ssh-key: ${{ secrets.HOMEPAGE_REFRESH_DEPLOY_KEY }}

      - name: Prepare homepage request branch
        working-directory: _homepage
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code origin refs/heads/graph-refresh-requests >/dev/null; then
            git fetch origin graph-refresh-requests
            git checkout -B graph-refresh-requests FETCH_HEAD
            git merge --no-edit origin/main
          else
            git checkout -b graph-refresh-requests
          fi

      - name: Record completed graph snapshot
        env:
          GRAPH_REVISION: ${{ needs.refresh.outputs.revision }}
          INPUT_REVISION: ${{ needs.refresh.outputs.input-revision }}
          SNAPSHOT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 _graph/scripts/refresh_homepage.py _homepage

      - name: Request homepage rebuild
        working-directory: _homepage
        shell: bash
        run: |
          git add data/graph-refresh-request.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Request homepage rebuild after graph screenshots"
          for attempt in 1 2 3; do
            if git push origin HEAD:graph-refresh-requests; then
              exit 0
            fi
            git fetch origin graph-refresh-requests
            git rebase origin/graph-refresh-requests
            sleep $((attempt * 2))
          done
          echo "Unable to request the homepage rebuild" >&2
          exit 1
