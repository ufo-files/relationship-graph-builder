name: Rebuild graph from machine-data

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rebuild-graph.yml"
      - ".machine-data-revision"
      - ".nojekyll"
      - "app.js"
      - "assets/**"
      - "!assets/screenshots/**"
      - "data/curated_entities.json"
      - "data/entity_aliases.json"
      - "data/location_coordinates.json"
      - "index.html"
      - "map-globe.js"
      - "package-lock.json"
      - "package.json"
      - "scripts/**"
      - "styles.css"
      - "tests/**"
      - "vendor/**"
  pull_request:
    paths:
      - ".github/workflows/rebuild-graph.yml"
      - "app.js"
      - "assets/**"
      - "data/curated_entities.json"
      - "data/entity_aliases.json"
      - "data/location_coordinates.json"
      - "index.html"
      - "map-globe.js"
      - "package-lock.json"
      - "package.json"
      - "scripts/**"
      - "styles.css"
      - "tests/**"
      - "vendor/**"
  workflow_dispatch:
  repository_dispatch:
    types: [machine-data-updated]

permissions:
  contents: read

concurrency:
  group: relationship-graph-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out builder
        uses: actions/checkout@v7

      - name: Check out machine-data
        uses: actions/checkout@v7
        with:
          repository: ufo-files/machine-data
          path: _machine-data

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build catalog
        shell: bash
        run: |
          revision="$(git -C _machine-data rev-parse HEAD)"
          python3 scripts/build_catalog.py \
            --input _machine-data \
            --input-repository ufo-files/machine-data \
            --input-revision "$revision" \
            --require-data

      - name: Run tests
        run: |
          python3 -m unittest discover -s tests -v
          node --check app.js
          node --check map-globe.js
          node --test tests/test_app.js

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install screenshot dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Validate graph screenshots
        env:
          GRAPH_SCREENSHOT_OUTPUT_DIR: ${{ runner.temp }}/graph-screenshots
        shell: bash
        run: |
          server_log="$RUNNER_TEMP/graph-builder-http.log"
          python3 -m http.server 4173 --bind 127.0.0.1 >"$server_log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat "$server_log"
              exit 1
            fi
            sleep 1
          done
          npm run screenshots
          if ! git diff --quiet -- README.md; then
            git diff -- README.md
            echo "README graph screenshots are out of date" >&2
            exit 1
          fi

  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Check out builder
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Resolve machine-data revision
        id: upstream
        shell: bash
        run: |
          revision="$(git ls-remote https://github.com/ufo-files/machine-data.git refs/heads/main | cut -f1)"
          test -n "$revision"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Check out machine-data
        uses: actions/checkout@v7
        with:
          repository: ufo-files/machine-data
          ref: ${{ steps.upstream.outputs.revision }}
          path: _machine-data

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build catalog
        env:
          UPSTREAM_REVISION: ${{ steps.upstream.outputs.revision }}
        run: |
          python3 scripts/build_catalog.py \
            --input _machine-data \
            --input-repository ufo-files/machine-data \
            --input-revision "$UPSTREAM_REVISION" \
            --require-data

      - name: Run tests
        run: |
          python3 -m unittest discover -s tests -v
          node --check app.js
          node --check map-globe.js
          node --test tests/test_app.js

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install screenshot dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Refresh graph screenshots
        shell: bash
        run: |
          server_log="$RUNNER_TEMP/graph-builder-http.log"
          python3 -m http.server 4173 --bind 127.0.0.1 >"$server_log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat "$server_log"
              exit 1
            fi
            sleep 1
          done
          npm run screenshots

      - name: Commit refreshed catalog and screenshots
        env:
          UPSTREAM_REVISION: ${{ steps.upstream.outputs.revision }}
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- README.md assets/screenshots data/catalog.json data/duplicate_candidates.json)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/screenshots data/catalog.json data/duplicate_candidates.json
          git commit -m "Rebuild graph from machine-data@${UPSTREAM_REVISION:0:7}"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "Unable to publish the refreshed graph catalog" >&2
          exit 1

      - name: Stage static site
        run: |
          mkdir -p _site
          cp index.html app.js map-globe.js styles.css .nojekyll _site/
          cp -R assets data vendor _site/

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: needs.publish.result == 'success'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
