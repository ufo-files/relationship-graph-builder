name: Rebuild graph from machine-data

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rebuild-graph.yml"
      - ".machine-data-revision"
      - ".nojekyll"
      - "app.js"
      - "assets/**"
      - "!assets/screenshots/**"
      - "data/curated_entities.json"
      - "data/curated_events.json"
      - "data/entity_aliases.json"
      - "data/location_coordinates.json"
      - "index.html"
      - "map-globe.js"
      - "scripts/**"
      - "!scripts/capture_graph_screenshots.mjs"
      - "styles.css"
      - "tests/**"
      - "vendor/**"
  pull_request:
    paths:
      - ".github/workflows/rebuild-graph.yml"
      - "app.js"
      - "assets/**"
      - "!assets/screenshots/**"
      - "data/curated_entities.json"
      - "data/curated_events.json"
      - "data/entity_aliases.json"
      - "data/location_coordinates.json"
      - "index.html"
      - "map-globe.js"
      - "scripts/**"
      - "!scripts/capture_graph_screenshots.mjs"
      - "styles.css"
      - "tests/**"
      - "vendor/**"
  workflow_dispatch:
  repository_dispatch:
    types: [machine-data-updated]

permissions:
  contents: read

concurrency:
  group: relationship-graph-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'rebuild' }}
  # Machine-data can advance faster than a catalog build. Keep only the newest
  # rebuild; Pages deployment is deliberately handled by deploy-pages.yml.
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out builder
        uses: actions/checkout@v7

      - name: Check out machine-data
        uses: actions/checkout@v7
        with:
          repository: ufo-files/machine-data
          path: _machine-data

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build catalog
        shell: bash
        run: |
          revision="$(git -C _machine-data rev-parse HEAD)"
          python3 scripts/build_catalog.py \
            --input _machine-data \
            --input-repository ufo-files/machine-data \
            --input-revision "$revision" \
            --require-data

      - name: Run tests
        run: |
          python3 -m unittest discover -s tests -v
          node --check app.js
          node --check map-globe.js
          node --test tests/test_app.js

  publish:
    if: github.event_name != 'pull_request'
    runs-on: ufo-agent-1-graph-builder
    permissions:
      contents: read
    steps:
      - name: Check out builder
        uses: actions/checkout@v7
        with:
          ref: main
          ssh-key: ${{ secrets.MAIN_AUTOMATION_DEPLOY_KEY }}

      - name: Resolve machine-data revision
        id: upstream
        shell: bash
        run: |
          revision="$(git ls-remote https://github.com/ufo-files/machine-data.git refs/heads/main | cut -f1)"
          test -n "$revision"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Check out machine-data
        uses: actions/checkout@v7
        with:
          repository: ufo-files/machine-data
          ref: ${{ steps.upstream.outputs.revision }}
          path: _machine-data

      - name: Verify system Python
        run: python3 --version

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Build catalog
        env:
          UPSTREAM_REVISION: ${{ steps.upstream.outputs.revision }}
        run: |
          python3 scripts/build_catalog.py \
            --input _machine-data \
            --input-repository ufo-files/machine-data \
            --input-revision "$UPSTREAM_REVISION" \
            --require-data

      - name: Run tests
        run: |
          python3 -m unittest discover -s tests -v
          node --check app.js
          node --check map-globe.js
          node --test tests/test_app.js

      - name: Commit refreshed catalog
        env:
          UPSTREAM_REVISION: ${{ steps.upstream.outputs.revision }}
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- data/catalog.json data/duplicate_candidates.json data/date_review.json)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json data/duplicate_candidates.json data/date_review.json
          git commit -m "Rebuild graph from machine-data@${UPSTREAM_REVISION:0:7}"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "Unable to publish the refreshed graph catalog" >&2
          exit 1
