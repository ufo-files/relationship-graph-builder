<title id="title">Cape Fear red-eyed being silhouette</title>
<desc id="desc">A small glassy-looking humanoid with little visible neck, circular red goggle-like eyes, a lower-face covering, and a dark chest plate, based on the witness description published in the 2008 MUFON Journal.</desc>
<metadata>
Created by potrace 1.16, written by Peter Selinger 2001-2019
</metadata>
